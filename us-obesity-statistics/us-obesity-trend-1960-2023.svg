<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="trend-embed-title trend-embed-desc">
<title id="trend-embed-title">US adult obesity, overweight and severe obesity, 1960–2023</title>
<desc id="trend-embed-desc">Age-adjusted percent of US adults ages 20 to 74, measured by NHANES. Obesity rose from 13.4% in 1960–1962 to 40.8% in August 2021–August 2023. Severe obesity rose from 0.9% to 10.2%. Overweight stayed near 31% (31.5% to 31.3%). Source: CDC NCHS Health E-Stat 111.</desc>
